# Alembic configuration for SurgeGuard.
#
# The database URL is deliberately absent: it is read from application settings
# in alembic/env.py so that migrations and the running application can never
# disagree about which database they are pointed at.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# Timestamped, descriptive migration filenames - so the history is readable
# without opening every file.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
