[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "surgeguard-backend"
version = "0.1.0"
description = "SurgeGuard Backend - orchestration layer between the AI Pipeline, database and Command Center."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "aiosqlite>=0.20",
    "alembic>=1.13,<2",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    # USB serial link to the alert hardware (Arduino RGB LED and buzzer).
    "pyserial>=3.5",
    # The AI Pipeline is a separate package. The dependency direction is always
    # backend -> surgeguard_ai and never the reverse (07:99-103).
    "surgeguard-ai",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "asgi-lifespan>=2.1",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
